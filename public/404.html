<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#7B4520" />
    <title>Página não encontrada | Malu Vieira</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f0eae0;
        color: #2c1810;
        font-family: Inter, sans-serif;
      }
      main {
        width: min(680px, 100%);
        text-align: center;
        padding: clamp(40px, 8vw, 80px) clamp(24px, 6vw, 64px);
        border: 1px solid rgba(123, 69, 32, 0.16);
        border-radius: 24px;
        background: #faf5ef;
        box-shadow: 0 24px 64px rgba(44, 24, 16, 0.1);
      }
      .brand {
        margin-bottom: 36px;
        font: italic 700 24px "Playfair Display", serif;
      }
      .brand span { color: #7b4520; }
      .tag {
        display: inline-block;
        margin-bottom: 18px;
        color: #7b4520;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 18px;
        font: 800 clamp(36px, 8vw, 64px)/1.05 "Bricolage Grotesque", sans-serif;
        letter-spacing: -0.04em;
      }
      p {
        max-width: 470px;
        margin: 0 auto 32px;
        color: rgba(44, 24, 16, 0.66);
        line-height: 1.7;
      }
      .home-link {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 13px 28px;
        border-radius: 999px;
        background: #7b4520;
        color: #f5ede3;
        font-weight: 600;
        text-decoration: none;
      }
      .home-link:hover { background: #5c3317; }
      a:focus-visible { outline: 3px solid #a07252; outline-offset: 4px; }
      nav {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 28px;
      }
      nav a {
        color: #7b4520;
        font-size: 14px;
        font-weight: 600;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Malu<span>.</span></div>
      <div class="tag">Erro 404</div>
      <h1>Página não encontrada.</h1>
      <p>
        O endereço pode ter mudado ou não existir. Volte à página inicial para
        conhecer meus serviços e projetos.
      </p>
      <a class="home-link" href="/">Voltar para a página inicial</a>
      <nav aria-label="Links úteis">
        <a href="/#servicos">Serviços</a>
        <a href="/#portfolio">Portfólio</a>
        <a href="/#contato">Contato</a>
      </nav>
    </main>
  </body>
</html>
